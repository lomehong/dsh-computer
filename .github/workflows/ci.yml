name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
        cache: npm
      - name: Install dependencies
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 发布包内容审计（dry-run）：files 白名单与入口完整性的门禁
      - run: node scripts/audit-pack.mjs
