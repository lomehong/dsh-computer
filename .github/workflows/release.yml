name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 GitHub Release 并上传 tarball

# 纯 GitHub 分发：tag 一推 -> 构建 + 审计 + tarball 挂 GitHub Release。
# 安装：dsh plugin --profile web add <Release 页面的 .tgz URL>
# 本仓库有 package-lock.json
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
        cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts
      - run: node scripts/audit-pack.mjs *.tgz --tag "${GITHUB_REF_NAME}"
      - run: cp dsh-extra-dsh-computer-*.tgz dsh-computer-latest.tgz
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
